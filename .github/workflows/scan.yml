name: Scan Epic FHIR servers

on:
  workflow_dispatch: # ad hoc only: Actions -> Run workflow, or `gh workflow run scan.yml`

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan and upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SCAN_TRIGGER: github-manual
        run: python3 -I scanner/scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ github.run_id }}
          path: data/latest_scan.json
          retention-days: 90
          if-no-files-found: ignore
